# Server
server.port=${PORT:8080}

# Database - uses environment variable on Render, local MySQL otherwise
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/jobportal?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root123}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Secret
app.jwt.secret=${APP_JWT_SECRET:jobportal-super-secret-key-minimum-256-bits-long-keep-this-safe}
app.jwt.expiration=${APP_JWT_EXPIRATION:86400000}

# Google OAuth2
app.google.client-id=${APP_GOOGLE_CLIENT_ID:66393331730-5qdgin6dr9ltisbn42eu7lh9mc6ulkdg.apps.googleusercontent.com}

# Twilio
twilio.account-sid=${TWILIO_ACCOUNT_SID:dummy}
twilio.auth-token=${TWILIO_AUTH_TOKEN:dummy}
twilio.from-number=${TWILIO_FROM_NUMBER:+10000000000}

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Logging
logging.level.com.jobportal=DEBUG